name: Auto Update Feed Packages

on:
  repository_dispatch:
    types: [flowsense_updated, npu_updated]
  workflow_dispatch:
    inputs:
      package_name:
        description: 'Package directory to update'
        required: false
        default: 'all'

jobs:
  update-package:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Feed Repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Determine Package Target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            if [ "${{ github.event.action }}" = "flowsense_updated" ]; then
              echo "pkg=luci-app-airoha-flowsense" >> $GITHUB_OUTPUT
            elif [ "${{ github.event.action }}" = "npu_updated" ]; then
              echo "pkg=luci-app-airoha-npu" >> $GITHUB_OUTPUT
            fi
          else
            echo "pkg=${{ github.event.inputs.package_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Update Package Sources
        run: |
          TARGET_PKG="${{ steps.target.outputs.pkg }}"
          echo "Updating target: $TARGET_PKG"
          
          # Если оформлено как Git Submodule:
          if [ "$TARGET_PKG" = "all" ]; then
            git submodule update --init --remote
          else
            git submodule update --init --remote "$TARGET_PKG"
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add .
          if git diff --staged --quiet; then
            echo "No changes detected."
          else
            git commit -m "chore(deps): update ${{ steps.target.outputs.pkg }} to ${{ github.event.client_payload.ref || 'latest' }}"
            git push origin main
          fi
